services:
  # 1. MASTER (PRIMARY)
  db-master:
    image: postgres:15
    restart: always
    ports:
      - "5433:5432" # Do bezpośrednich migracji i tworzenia tabel z Pythona
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint:
      - bash
      - -c
      - |
        docker-entrypoint.sh postgres --version > /dev/null
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Inicjalizacja konfiguracji Mastera..."
          _main() { docker-entrypoint.sh postgres & PID=$!; sleep 5; kill $PID; wait $PID; }
          _main
        fi
        # Konfiguracja zabezpieczeń pg_hba: wpuszczamy replikację (md5) i ruch z proxy (trust)
        # WAŻNE: domyślna reguła "host all all all scram-sha-256" jest pierwsza i przesłaniała trust,
        # dlatego podmieniamy ją na trust (Postgres bierze pierwszą pasującą regułę).
        sed -i 's/^host all all all scram-sha-256/host all all all trust/' /var/lib/postgresql/data/pg_hba.conf
        if ! grep -q "host replication all all md5" /var/lib/postgresql/data/pg_hba.conf; then
          echo "host replication all all md5" >> /var/lib/postgresql/data/pg_hba.conf
        fi
        if ! grep -q "host all all all trust" /var/lib/postgresql/data/pg_hba.conf; then
          echo "host all all all trust" >> /var/lib/postgresql/data/pg_hba.conf
        fi
        exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10 -c max_replication_slots=10 -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    volumes:
      - pgdata_master:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy: &resources
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 512M

  # 2. SLAVE (REPLICA)
  db-replica:
    image: postgres:15
    restart: always
    depends_on:
      db-master:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo "Wolumen czysty. Klonowanie bazy z Mastera..."
          until pg_isready -h db-master -p 5432 -U $POSTGRES_USER; do
            sleep 2
          done
          rm -rf /var/lib/postgresql/data/*
          pg_basebackup -h db-master -p 5432 -U $POSTGRES_USER -D /var/lib/postgresql/data -Fp -Xs -R -P
        fi
        exec docker-entrypoint.sh postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    deploy:
      <<: *resources

  # 3. PROXY (PGPOOL-II)
  pgpool:
    image: pgpool/pgpool:latest
    restart: always
    ports:
      - "5432:9999" # Mapowanie portu 5432 hosta na wewnętrzny port 9999 Pgpoola
    depends_on:
      db-master:
        condition: service_healthy
      db-replica:
        condition: service_started
    environment:
      # Tryb klastra: replikacja strumieniowa (pgpool 4.x). Stare master_slave_sub_mode już nie działa.
      PGPOOL_PARAMS_BACKEND_CLUSTERING_MODE: streaming_replication

      # Backend 0 = MASTER (primary). waga 0 => nie dostaje load-balancowanych SELECTów (tylko zapisy/DDL)
      PGPOOL_PARAMS_BACKEND_HOSTNAME0: db-master
      PGPOOL_PARAMS_BACKEND_PORT0: "5432"
      PGPOOL_PARAMS_BACKEND_WEIGHT0: "0"
      PGPOOL_PARAMS_BACKEND_FLAG0: ALWAYS_PRIMARY

      # Backend 1 = REPLICA (standby). waga 1 => dostaje load-balancowane SELECTy
      PGPOOL_PARAMS_BACKEND_HOSTNAME1: db-replica
      PGPOOL_PARAMS_BACKEND_PORT1: "5432"
      PGPOOL_PARAMS_BACKEND_WEIGHT1: "1"

      # Load balancing odczytów
      PGPOOL_PARAMS_LOAD_BALANCE_MODE: "on"

      # Streaming replication check (poprawna nazwa parametru)
      PGPOOL_PARAMS_SR_CHECK_PERIOD: "10"
      PGPOOL_PARAMS_SR_CHECK_USER: ${POSTGRES_USER}
      PGPOOL_PARAMS_SR_CHECK_PASSWORD: ${POSTGRES_PASSWORD}
      PGPOOL_PARAMS_SR_CHECK_DATABASE: ${POSTGRES_DB}

      # Health check backendów
      PGPOOL_PARAMS_HEALTH_CHECK_PERIOD: "10"
      PGPOOL_PARAMS_HEALTH_CHECK_USER: ${POSTGRES_USER}
      PGPOOL_PARAMS_HEALTH_CHECK_PASSWORD: ${POSTGRES_PASSWORD}
      PGPOOL_PARAMS_HEALTH_CHECK_DATABASE: ${POSTGRES_DB}

      # Backendy używają trust (patrz pg_hba mastera) => wyłączamy pool_hba,
      # ale generujemy pool_passwd na wypadek auth md5/scram od strony klienta.
      PGPOOL_ENABLE_POOL_HBA: "no"
      PGPOOL_POSTGRES_USERNAME: ${POSTGRES_USER}
      PGPOOL_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  # 4. PANEL ADMINISTRACYJNY
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - pgpool

volumes:
  pgdata_master:
  pgdata_replica: